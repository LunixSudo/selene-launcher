name: Labels

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml

permissions: {}

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create labels and update their colors and descriptions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Labels missing from the file are left alone, so nothing is ever taken off an issue.
      - name: Create or update the labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -r '.[] | [.name, .color, .description] | @tsv' .github/labels.json |
            while IFS=$'\t' read -r name color description; do
              gh label create "$name" --color "$color" --description "$description" --force
            done
