name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Collect the installer and the portable version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory dist, portable | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe "dist/SeleneLauncher-Windows-Setup-$version.exe"
          Copy-Item target/release/selene-launcher.exe, LICENSE portable/
          New-Item -ItemType File portable/portable.txt | Out-Null
          Compress-Archive -Path portable/* -DestinationPath "dist/SeleneLauncher-Windows-Portable-$version.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: selene-launcher-windows
          path: dist/
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --generate-notes
