name: Bug report
description: Something does not work as it should.
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Russian, whichever is easier. "Report a problem" in the launcher
        settings opens this form with the version, system and log already filled in.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown at the bottom of the settings page.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 (26100), x86_64
  - type: input
    id: instance
    attributes:
      label: Game version and loader
      placeholder: 1.21.1, Fabric 0.16.5
  - type: textarea
    id: log
    attributes:
      label: Launcher log
      description: >-
        Optional, but it helps a lot. Attach `logs/launcher.log` from the launcher folder, or
        the file the launcher showed you. It holds no passwords or tokens.
